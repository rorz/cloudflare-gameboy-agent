<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Cloudboy viewport check</title>
<style>
  body { margin: 14px; background: #171412; color: #e1d8cd; font: 14px system-ui; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  iframe { display: block; border: 1px solid #5c4d43; }
</style>
<nav aria-label="Preview sizes and D-pad states">
  <button type="button" data-size="390,844">Portrait</button>
  <button type="button" data-size="320,568">Compact</button>
  <button type="button" data-size="844,390">Landscape</button>
  <button type="button" data-key="ArrowUp">Hold Up</button>
  <button type="button" data-key="ArrowDown">Hold Down</button>
  <button type="button" data-key="ArrowLeft">Hold Left</button>
  <button type="button" data-key="ArrowRight">Hold Right</button>
  <button type="button" data-key="">Release D-pad</button>
</nav>
<iframe id="cloudboy-preview" title="Cloudboy preview" width="390" height="844" src="/"></iframe>
<script>
  const frame = document.querySelector('iframe');
  let held = '';
  function send(type, code) {
    const player = frame.contentWindow;
    player.dispatchEvent(new player.KeyboardEvent(type, { code, bubbles: true, cancelable: true }));
  }
  document.querySelector('nav').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.dataset.size) {
      [frame.width, frame.height] = button.dataset.size.split(',');
      return;
    }
    if (held) send('keyup', held);
    held = button.dataset.key;
    if (held) send('keydown', held);
  });
</script>
</html>
