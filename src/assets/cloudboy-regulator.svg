<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 196" fill="none">
  <title>Cloudboy Color DC converter board</title>
  <desc>Populated regulator daughterboard with side solder terminals, power transistors, passives and an inductor.</desc>
  <defs>
    <linearGradient id="mask" x2=".9" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#459483"/><stop offset=".53" stop-color="#266956"/><stop offset="1" stop-color="#1d4f45"/>
    </linearGradient>
    <linearGradient id="solder" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#746658"/><stop offset=".25" stop-color="#faf0d6"/><stop offset=".61" stop-color="#b0af9e"/><stop offset="1" stop-color="#746354"/>
    </linearGradient>
    <linearGradient id="package" x2=".65" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#504b43"/><stop offset=".28" stop-color="#33382f"/><stop offset="1" stop-color="#242824"/>
    </linearGradient>
    <g id="passive">
      <rect width="17" height="6" rx=".75" fill="#32362c"/>
      <path d="M1 1h4v4H1zm11 0h4v4h-4z" fill="url(#solder)"/>
    </g>
    <g id="cap">
      <rect width="13" height="9" rx="1" fill="#80674b"/>
      <path d="M0 1h4v7H0zm9 0h4v7H9z" fill="url(#solder)"/>
    </g>
    <g id="eyelet">
      <circle r="5.3" fill="#b7aa79"/><circle r="4.2" cx=".6" cy="-.5" fill="url(#solder)"/><circle r="1.5" fill="#554c42"/>
    </g>
    <pattern id="leads" width="5" height="8" patternUnits="userSpaceOnUse">
      <rect x=".8" width="2.8" height="8" rx=".6" fill="url(#solder)"/>
    </pattern>
  </defs>
  <path d="M21 7h133l16 13v157l-13 12H18L7 175V30z" fill="url(#mask)" stroke="#8fb59a" stroke-width="2.5"/>
  <g stroke="#98ab77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".86">
    <path d="M16 87h14l12-12V43l10-10h64l17 16v25l20 20h13M16 103h27l13-13h46l21-21h27l16 15M16 119h24l13-12h67l24 23h22M16 136h32l19 18h44l19-19h19l17 8M16 152h18l10 12h79l15-15h27M16 168h14l11 10h89l14-14h21M28 32h12l12-13h64l18 14h20l12 13M43 73h31l8-7h24l11-11h31M62 101v26l9 9h35l8 10M89 87h45l18 19h15"/>
  </g>
  <g stroke="#e0dfb6" stroke-width="1.1" opacity=".74">
    <path d="M22 41v-5h33v32H22m48-24h48v37H68m63-36h20v22h-20m-86 19h27v54H45m35-41h51v39H80m44 11h26v26h-26"/>
  </g>
  <g>
    <use href="#eyelet" x="17" y="87"/><use href="#eyelet" x="17" y="103"/><use href="#eyelet" x="17" y="120"/>
    <use href="#eyelet" x="17" y="136"/><use href="#eyelet" x="17" y="153"/><use href="#eyelet" x="17" y="168"/>
    <use href="#eyelet" x="162" y="82"/><use href="#eyelet" x="162" y="97"/><use href="#eyelet" x="162" y="113"/>
    <use href="#eyelet" x="162" y="128"/><use href="#eyelet" x="162" y="143"/><use href="#eyelet" x="162" y="160"/>
  </g>
  <g>
    <use href="#passive" x="34" y="20"/><use href="#passive" x="77" y="24"/>
    <use href="#passive" transform="translate(126 27) rotate(90)"/><use href="#cap" x="142" y="32"/>
    <use href="#cap" x="49" y="74"/><use href="#passive" x="66" y="81"/><use href="#passive" x="88" y="88"/>
    <use href="#cap" transform="translate(141 83) rotate(90)"/><use href="#cap" x="143" y="115"/>
    <use href="#passive" x="27" y="112"/><use href="#passive" transform="translate(36 125) rotate(90)"/>
    <use href="#cap" x="47" y="147"/><use href="#cap" x="73" y="153"/><use href="#passive" x="93" y="159"/>
    <use href="#passive" x="44" y="171"/><use href="#passive" x="71" y="173"/>
  </g>
  <rect x="74" y="43" width="41" height="38" rx="1.5" fill="url(#leads)"/>
  <rect x="71" y="49" width="47" height="26" rx="1.6" fill="url(#package)" stroke="#768170"/>
  <circle cx="76" cy="54" r="1.2" fill="#b4aa91"/>
  <rect x="39" y="88" width="35" height="33" rx="1.3" fill="url(#leads)"/>
  <rect x="36" y="93" width="41" height="23" rx="1.5" fill="url(#package)" stroke="#6e7969"/>
  <rect x="89" y="100" width="33" height="39" rx="2" fill="url(#solder)"/>
  <rect x="85" y="105" width="41" height="29" rx="2" fill="url(#package)" stroke="#b8af94"/>
  <path d="M94 115h13m-13 5h20m-20 5h13" stroke="#949481" stroke-width="1.4"/>
  <rect x="26" y="39" width="24" height="20" rx="1.6" fill="url(#solder)" stroke="#908a72"/>
  <path d="M28 42h19v6H28z" fill="#e8dab9" fill-opacity=".76"/>
  <rect x="132" y="47" width="20" height="18" rx="2" fill="url(#package)" stroke="#a99b7e"/>
  <rect x="125" y="145" width="24" height="27" rx="2" fill="url(#package)" stroke="#9a927b"/>
  <path d="M128 148h17m-15 18h14" stroke="#a29580" stroke-width="1.6"/>
  <g fill="#e0dfb6" font-family="monospace" font-size="6.7" font-weight="700">
    <text x="23" y="17">DC CONV</text><text x="64" y="44">U1</text><text x="82" y="107">L1</text>
    <text x="21" y="79">VIN</text><text x="115" y="183">VOUT</text>
